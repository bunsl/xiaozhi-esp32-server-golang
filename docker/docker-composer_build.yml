version: '3.8'

services:

  # 主程序服务
  main-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    container_name: xiaozhi-main-server
    ports:
      - "18989:8989"
      - "12883:2883"
    depends_on:
      - backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root123456
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
    volumes:
      - ../config:/workspace/config
      - ../logs:/workspace/logs
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # 后端管理服务
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: xiaozhi-backend
    ports:
      - "28080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
    volumes:
      - ../manager/backend/config:/root/config
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # 前端管理服务
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: xiaozhi-frontend
    ports:
      - "18080:80"
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

networks:
  xiaozhi-network:
    driver: bridge
