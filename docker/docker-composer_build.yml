services:

  # 主程序服务
  main-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    container_name: xiaozhi-main-server
    ports:
      - "8989:8989"        # websocket服务 端口 18989端口
      - "1883:2883"        # mqtt server 12883
      - "8990:8990/udp"
    depends_on:
      - backend
      - voice-server
    environment:
      - DB_HOST=172.16.80.50
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root123456
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
      - VOICE_IDENTIFY_BASE_URL=http://voice-server:8080
    volumes:
      - ../config:/workspace/config
      - ../logs:/workspace/logs
      - ../data/meetings:/workspace/data/meetings
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # 后端管理服务
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: xiaozhi-backend
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=172.16.80.50
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root123456
      - DB_NAME=xiaozhi_admin
      - AUDIO_BASE_PATH=/data/chat_history/audio
      - SPEAKER_SERVICE_URL=http://voice-server:8080
    volumes:
      - ../manager/backend/config:/root/config
      - backend_audio_data:/data/chat_history/audio
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # 前端管理服务
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: xiaozhi-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  voice-server:
    image: ghcr.io/hackers365/voice_server:0.1.2
    container_name: xiaozhi-voice-server
    ports:
      - "8082:8080"
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  backend_audio_data:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
